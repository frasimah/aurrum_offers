<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURRUM — вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
      color: #2d2d2d;
      font-family: Inter, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 340px;
    }

    .logo {
      width: 150px;
      margin-bottom: 40px;
    }

    h1 {
      margin: 0 0 32px;
      font-size: 20px;
      font-weight: 400;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #949598;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #c9c9c9;
      background: #fff;
      color: #2d2d2d;
      font-family: inherit;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #2d2d2d;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: 1px solid #2d2d2d;
      background: #2d2d2d;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #fff;
      color: #2d2d2d;
    }

    .error {
      margin-bottom: 20px;
      padding: 12px 14px;
      border: 1px solid #d64545;
      color: #d64545;
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <div class="box">
    <img class="logo" src="{{ url_for('static', filename='aurrum-logo.svg') }}" alt="AURRUM">
    <h1>Доступ к конвертеру</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post">
      <label for="password">Пароль</label>
      <input type="password" name="password" id="password" autocomplete="current-password" autofocus required>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>

</html>
